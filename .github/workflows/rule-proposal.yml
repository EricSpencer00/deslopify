name: Rule proposal

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open rule issue number to turn into an add/change pull request
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rule-proposal-${{ github.event.issue.number || inputs.issue_number }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-issue:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[Rule]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate form answers
        env:
          ISSUE_EVENT: ${{ github.event_path }}
        run: python3 scripts/propose_rule.py --issue-json "$ISSUE_EVENT" --dry-run

  propose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and validate a proposal pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/rule_pull_request.py
      - name: Keep the patch if pull request creation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rule-proposal-${{ inputs.issue_number }}
          path: ${{ runner.temp }}/rule-proposal.patch
          if-no-files-found: ignore
          retention-days: 7
