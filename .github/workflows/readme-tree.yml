name: Update model catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readme-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: python3 scripts/sync_model_harnesses.py
      - run: python3 scripts/validate_content.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/update_readme_tree.py

      - name: Check generated files on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- README.md MODEL-CATALOG.md deslopify/fac/_template/models deslopify/ne-fac/_template/models

      - name: Commit catalog changes
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- README.md MODEL-CATALOG.md deslopify/fac/_template/models deslopify/ne-fac/_template/models; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md MODEL-CATALOG.md deslopify/fac/_template/models deslopify/ne-fac/_template/models
          git commit -m "Update generated model slots"
          git push
