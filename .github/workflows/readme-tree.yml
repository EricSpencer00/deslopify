name: Update model catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rule-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readme-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check submitted generated guidance
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/sync_model_harnesses.py --check
          python3 deslopify/scripts/rules.py render --check
      - run: python3 scripts/sync_model_harnesses.py
      - run: python3 deslopify/scripts/rules.py render
      - run: python3 scripts/validate_content.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/update_readme_tree.py
      - name: Check catalog on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- README.md MODEL-CATALOG.md deslopify/fac deslopify/ne-fac deslopify/references

  generate:
    needs: readme-tree
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sync_model_harnesses.py
      - run: python3 deslopify/scripts/rules.py render
      - run: python3 scripts/update_readme_tree.py
      - name: Commit generated changes
        run: |
          if git diff --quiet -- MODEL-CATALOG.md deslopify/fac deslopify/ne-fac deslopify/references && [ -z "$(git ls-files --others --exclude-standard deslopify/fac deslopify/ne-fac deslopify/references)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODEL-CATALOG.md deslopify/fac deslopify/ne-fac deslopify/references
          git commit -m "Update generated rules and model catalog"
          git push
